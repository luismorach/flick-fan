<!-- icon.component.html -->
<ng-container [ngSwitch]="name">
    <svg *ngSwitchCase="'plus'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
    </svg>

    <svg *ngSwitchCase="'clock'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12,6 12,12 16,14"></polyline>
    </svg>

    <svg *ngSwitchCase="'info'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512" width="20" height="20" fill="none" stroke="currentColor" stroke-width="46">
        <circle cx="256" cy="256" r="216" />
        <line x1="256" y1="230" x2="256" y2="352" stroke-linecap="round" />
        <circle cx="256" cy="144" r="36" fill="currentColor" stroke="none" />
    </svg>

    <!-- <svg *ngSwitchCase="'star'" class="{{ size }} {{ color }} {{backgroundColor}}" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
    </svg> -->

    <svg *ngSwitchCase="'clapperboard'" class="{{ size }} {{ color }} {{backgroundColor}}"
        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="48" height="48" fill="currentColor">
        <path
            d="M434.65500000000003 204.75999999999976l-269.311 2c36.679-13.69 74.355-27.48 112.429-41.35 48.54-17.78 97.08-35.46 142.73-52.67 3.69-1.55 6.589-4.43 8.064-8a13.97 13.97 0 0 0-0.191-11.11l-1.893-4.27a503 503 0 0 0-30.102-64.08c-1.914-2.5-4.647-4.32-7.769-5.19-3.122-0.86-6.453-0.7-9.473 0.44a47263 47263 0 0 1-129.473 47.72c-74.953 27.66-160.67 59.13-193.86 71.49-3.556 1.33-6.43 3.93-8.01 7.25a13.44 13.44 0 0 0-0.462 10.53c5.283 13.97 8.672 22.91 11.163 29.08-6.925 6.11-11.842 14.01-14.153 22.72l-0.797 3.52-0.3 1.33a17 17 0 0 0-0.298 3.04v7.23c0.087 1.38 0.32 2.75 0.697 4.09 1.613 8.67 5.719 16.75 11.86 23.32 6.142 6.58 14.079 11.41 22.926 13.94 0.199 36.03 0.697 147.54 0.697 169.12 0.005 3.7 1.55 7.25 4.297 9.87s6.47 4.09 10.355 4.1c52.127 0 343.266 1.24 343.266 1.24 3.852 0 7.552-1.45 10.295-4.03s4.308-6.09 4.357-9.76c0-1.61 2.292-159.89 2.292-213.6-0.199-15.88-15.449-17.97-19.336-17.97m-155.287 65.4l23.821-36.6 53.424-0.38-24.021 36.98z m-10.765-36.31l-23.622 36.31H192.255l23.323-36.02z m-36.38-81.75c-16.545 6.08-32.791 12.07-49.038 18.06l5.98-49.72 49.039-18.06z m35.084-12.93l-4.385 1.61 5.98-49.81 50.334-18.44-6.08 49.91z m128.676-47.34c-16.945 6.37-34.387 12.74-51.829 19.2l6.081-49.91 27.508-10.07c5.282 11.21 13.156 28.99 18.24 40.78m-311.073 82.32l-5.183-13.4c19.336-7.23 47.244-17.49 78.54-29l-5.98 49.82c-6.379 2.37-12.857 4.75-19.137 7.13-4.406-4.97-9.93-8.92-16.159-11.57-6.229-2.66-13.004-3.93-19.821-3.74-0.798 0-1.894 0.19-2.791 0.19-2.634-0.03-5.266 0.12-7.874 0.48a10.6 10.6 0 0 0-1.595 0.09m-12.857 48.67l0.598-6.65c1.488-4.84 4.785-8.99 9.266-11.68 4.481-2.68 9.836-3.69 15.053-2.87 5.2 0.66 9.945 3.17 13.275 7.04 3.331 3.86 4.999 8.79 4.666 13.78-0.5 4.38-2.579 8.43-5.881 11.5-0.474 0.47-0.974 0.92-1.495 1.34-3.664 2.97-8.253 4.7-13.056 4.94-5.18 0.41-10.335-1.05-14.435-4.1s-6.847-7.45-7.692-12.35c-0.06-0.32-0.16-0.64-0.3-0.95m35.482 43.73c0.997-0.28 1.794-0.85 2.791-1.23a49 49 0 0 0 10.166-4.57l0.2-0.09a51.9 51.9 0 0 0 10.764-8.65c0.299-0.29 0.598-0.48 0.797-0.67s0.698-0.95 1.097-1.33c0.797-0.95 1.495-1.9 2.193-2.85a43.2 43.2 0 0 0 7.176-12.36l38.273-0.28-23.223 35.74H107.535z m314.961 155.62c-54.62-0.19-247.883-1.05-314.164-1.14-0.099-28.05-0.299-83.66-0.498-122.92h316.355c-0.598 47.15-1.294 99.72-1.693 124.06m1.793-152.01h-57.41l24.12-37.26 33.39-0.29c0.099 10.56-0.1 23.48-0.1 37.55" />
    </svg>

    <svg *ngSwitchCase="'film'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="2" ry="2" />
        <line x1="7" y1="2" x2="7" y2="22" />
        <line x1="17" y1="2" x2="17" y2="22" />
        <line x1="2" y1="12" x2="22" y2="12" />
        <line x1="2" y1="7" x2="7" y2="7" />
        <line x1="2" y1="17" x2="7" y2="17" />
        <line x1="17" y1="17" x2="22" y2="17" />
        <line x1="17" y1="7" x2="22" y2="7" />
    </svg>

    <svg *ngSwitchCase="'tv'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2" />
        <polyline points="17 2 12 7 7 2" />
    </svg>

    <svg *ngSwitchCase="'play'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z" />
    </svg>


    <svg *ngSwitchCase="'filter'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <polygon points="22 3 2 3 10 12 10 19 14 21 14 12 22 3" />
    </svg>

    <svg *ngSwitchCase="'date'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>

    <svg *ngSwitchCase="'volume-high'" class="{{ size }} {{ color }} {{backgroundColor}}"
        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" fill="currentColor">

        <path d="M301.3 34.8c-7.6-3.4-16.5-2.1-22.9 3.3L142.6 160H64
           c-35.3 0-64 28.7-64 64v64c0 35.3 28.7 64 64 64h78.6
           l135.8 121.9c6.4 5.4 15.3 6.7 22.9 3.3
           s12.7-10.9 12.7-19.3V54.1
           c0-8.4-4.9-15.9-12.7-19.3z" />

        <path d="M400 180
         A80 80 0 0 1 400 300" fill="none" stroke="currentColor" stroke-width="50" stroke-linecap="round" />

        <path d="M460 105
         A180 180 0 0 1 460 375" fill="none" stroke="currentColor" stroke-width="50" stroke-linecap="round" />

        <path d="M520 30
         A270 270 0 0 1 520 450" fill="none" stroke="currentColor" stroke-width="50" stroke-linecap="round" />
    </svg>

    <svg *ngSwitchCase="'volume-xmark'" class="{{ size }} {{ color }} {{backgroundColor}}"
        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" fill="currentColor" width="48" height="48">

        <path d="M301.3 34.8c-7.6-3.4-16.5-2.1-22.9 3.3L142.6 160H64
           c-35.3 0-64 28.7-64 64v64c0 35.3 28.7 64 64 64h78.6
           l135.8 121.9c6.4 5.4 15.3 6.7 22.9 3.3
           s12.7-10.9 12.7-19.3V54.1
           c0-8.4-4.9-15.9-12.7-19.3z" />

        <path d="M420 200 L580 350 M580 200 L420 350" stroke="currentColor" stroke-width="50" stroke-linecap="round"
            fill="none" />
    </svg>


    <svg *ngSwitchCase="'maximize'" class="{{ size }} {{ color }} {{backgroundColor}}"
     xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Líneas diagonales principales (la X) -->
        <path d="M6 6l12 12M18 6L6 18" />

        <!-- Flecha superior izquierda -->
        <path d="M9 5H5v4" />

        <!-- Flecha superior derecha -->
        <path d="M15 5h4v4" />

        <!-- Flecha inferior izquierda -->
        <path d="M5 15v4h4" />

        <!-- Flecha inferior derecha -->
        <path d="M19 15v4h-4" />
    </svg>

   <!--  -->



    <svg *ngSwitchCase="'arrow-left'" class="{{ size }} {{ color }} {{backgroundColor}}" width="48" height="48"
        viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 24H18M18 24L24 18M18 24L24 30" stroke="white" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>

    <svg *ngSwitchCase="'arrow-right'" class="{{ size }} {{ color }} {{backgroundColor}}" width="48" height="48"
        viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 24H30M30 24L24 18M30 24L24 30" stroke="white" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>

    <svg *ngSwitchCase="'arrow-up'" class="{{ size }} {{ color }} {{backgroundColor}}" width="48" height="48"
        viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="23" stroke="white" stroke-opacity="0.2" fill="none" />
        <path d="M24 30V18M24 18L18 24M24 18L30 24" stroke="white" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>

    <svg *ngSwitchCase="'arrow-down'" class="{{ size }} {{ color }} {{backgroundColor}}" width="48" height="48"
        viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="23" stroke="white" stroke-opacity="0.2" fill="none" />
        <path d="M24 18V30M24 30L18 24M24 30L30 24" stroke="white" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>

    <svg *ngSwitchCase="'star'" class="{{ size }} {{ color }} {{backgroundColor}}" width="24" height="24"
        viewBox="0 0 24 24" class="inline-block">
        <defs>
            <!-- ID único por cada iteración -->
            <linearGradient [id]="gradId" x1="0%" y1="0%" x2="100%" y2="0%">
                <!-- Color activo -->
                <stop [attr.offset]="percentGrad + '%'" [attr.stop-color]="backgroundColor" />
                <!-- Color de fondo (el zinc-300 que usabas) -->
                <stop [attr.offset]="percentGrad + '%'" stop-color="#d4d4d8" />
            </linearGradient>
        </defs>

        <path [attr.fill]="'url(#' + gradId + ')'"
            d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
    </svg>

    <svg *ngSwitchCase="'close'" class="{{ size }} {{ color }} {{backgroundColor}}" xmlns="http://www.w3.org/2000/svg"
        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12" />
    </svg>

</ng-container>
