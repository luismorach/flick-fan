<main class="w-full">
    <section class="w-full h-auto flex justify-center">
        <div class="w-1/5 flex flex-col  px-6 pt-20 pb-4 mb-32">
            <figure class="z-10 relative w-full h-96 rounded-xl shadow-xs shadow-white">
                <img ngSrc="{{'http://image.tmdb.org/t/p/original'+movie()?.poster_path}}" fill priority #img
                    class="object-cover object-center rounded-xl ">
            </figure>
            <header class="text-white text-2xl font-racing pt-1">
                <h1>{{movie()?.title}}</h1>
                <app-rating class="flex pt-4 left-[-150%] font-roboto" [rating]="movie()?.vote_average"></app-rating>
                <div class="flex justify-between gap-6 items-end">
                    <div class="h-8 mt-4 px-2 max-w-40 lg:w-40 flex bg-neutral-900 justify-center 
                items-center rounded-lg focus-within:bg-neutral-800 shadow-md shadow-[#e50914]">
                        <input placeholder="Calificacion" type="text" class="text-neutral-300 bg-transparent grow text-sm h-8 outline-hidden w-full
                     placeholder-neutral-300">
                    </div>
                    <button class="border border-white rounded-xl px-4 text-sm hover:scale-110 h-6 mb-1
            hover:border-[#e50914] hover:text-[#e50914] cursor-pointer"> Calificar&nbsp;
                    </button>
                </div>
            </header>
            <article class="text-white font-roboto pt-14 flex flex-col">
                <h1 class="text-xl font-racing py-4"><i class="fa-solid fa-message text-[#e50914]"></i> &nbsp; Deja un
                    comentario</h1>
                <textarea class="bg-black w-full h-48 outline-hidden placeholder:text-neutral-400 p-2" rows="5"
                    cols="33" placeholder="Tu comentario..."></textarea>
                <button class="border border-white rounded-sm px-4 w-44 my-4 font-racing text-sm  self-center
                hover:scale-110 h-6 mb-1 hover:border-[#e50914] hover:text-[#e50914] cursor-pointer">
                    publicar comentario&nbsp;
                </button>
            </article>
        </div>
        <div class="w-4/5 z-10 relative pl-6 ">
            <div class="w-full h-screen pr-6 pt-20 pb-4">
                <iframe [src]="url_movie() | urlSafe" class="w-full h-full shadow-xs shadow-white outline-hidden"
                    allowfullscreen></iframe>
            </div>

            @defer(when similarMovies()){
            <app-carrousel [listMovies]="similarMovies()" title="similares" [importance]="2"></app-carrousel>
            }

            @defer(when recomendedMovies()){
            <app-carrousel [listMovies]="recomendedMovies()" title="recomendadas" [importance]="1"></app-carrousel>
            }
        </div>
    </section>
</main>
