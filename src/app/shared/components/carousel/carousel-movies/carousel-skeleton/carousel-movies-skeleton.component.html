@if(!insideCarousel()){
<main role="status" aria-live="assertive" class=" w-full overflow-x-hidden mb-16">
    @if(hasHeader()){
    <header class="mb-12" [style.padding-left.px]="peek()">
        <div class="font-black tracking-[0.4em] text-[8px] lg:text-[10px] block h-[1lh] w-16 bg-zinc-600 rounded animate-pulse mb-4"></div>
        <div class="text-2xl md:text-3xl lg:text-4xl font-black tracking-tighter h-[1lh] w-1/4 bg-zinc-600 rounded animate-pulse"></div>
    </header>
    }

    <section class="flex grow-0  h-full" role="status" aria-label="Cargando películas" aria-live="polite"
        [style.padding-left.px]="peek()" [style.padding-right.px]="peek()"
        [style.gap.px]="slidesInfo().layout().spaceBetween" #container>

        @for(_ of skeletons(); track $index) {
        <div class="h-full flex-shrink-0 aspect-[5/4]" [style.width.px]="slidesInfo().layout().slideMainAxisSize">
            <ng-container *ngTemplateOutlet="skeletonCard" class=""></ng-container>
        </div>
        }

    </section>

</main>

}@else{
<div class="h-full w-full flex-shrink-0 ">
    <ng-container *ngTemplateOutlet="skeletonCard"></ng-container>
</div>
}

<ng-template #skeletonCard>
    <section class="relative shadow-lg flex-none flex flex-col rounded-xl animate-pulse h-full w-full card-base-movie">

        <figure class="relative w-full aspect-video bg-zinc-700 rounded-t-2xl">
            <div
                class="badge-vote">
                <div class="w-5 h-5 bg-zinc-600 rounded-full"></div>
                <div class="badge-text w-5 h-[.8lh] bg-zinc-600 rounded"></div>
            </div>
        </figure>



        <section class="px-4 pt-3 pb-4  rounded-b-2xl">
            <div class="h-3.5 w-3/6 bg-zinc-600 rounded"></div>

            <div class="flex items-center gap-4 mt-3">
                <div class="h-2.5 w-24 bg-zinc-600 rounded"></div>
                <div class="h-2.5 w-[4ch] bg-zinc-600 rounded"></div>
            </div>
        </section>
    </section>
</ng-template>
