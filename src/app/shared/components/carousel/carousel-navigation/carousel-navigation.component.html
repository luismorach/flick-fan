<button type="button" aria-label="Diapositiva anterior" (click)="carouselService().navigation.prev()"
    class="btn-navigation glass-panel " [ngClass]="{
        'btn-navigation-horizontal-prev':carouselService().slidesInfo.direction()==='horizontal',
        'btn-navigation-vertical-prev':carouselService().slidesInfo.direction()==='vertical'
    }" [disabled]="carouselService().state().isAtStart() || !carouselService().isHoveredOverCarousel()">
    
        <app-icon [name]="carouselService().slidesInfo.direction() ==='horizontal' ? 'arrow-left' :'arrow-up' " 
        size="w-14 h-14"></app-icon>
    
</button>

<button type="button" aria-label="Diapositiva siguiente" (click)="carouselService().navigation.next()"
    class="btn-navigation glass-panel" [ngClass]="{
        'btn-navigation-horizontal-next':carouselService().slidesInfo.direction()==='horizontal',
        'btn-navigation-vertical-next':carouselService().slidesInfo.direction()==='vertical'
    }" [disabled]="carouselService().state().isAtEnd() || !carouselService().isHoveredOverCarousel()">

    <app-icon [name]="carouselService().slidesInfo.direction() ==='horizontal' ? 'arrow-right' :'arrow-down' " 
        size="w-14 h-14"></app-icon>
   
</button>
