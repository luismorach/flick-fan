<main class=" w-full  mb-12" #main>
    <header class="p-6 pl-6 text-white text-2xl">
         <h2 class="text-3xl font-bold text-white mb-2">
         <span class="inline-block relative bg-gradient-to-r from-red-400 to-red-700 bg-clip-text text-transparent
            after:h-1 after:w-3/5 after:bg-gradient-to-r after:from-red-400 after:to-red-700 
            after:rounded-full after:absolute  after:bottom-0 after:left-0 pb-2">
            {{title()}}
          </span>
        </h2>
    </header>

    <section class="relative">

        <swiper-container init="false" class="w-full h-80  z-0 relative" 
        (mouseenter)="isSwiperHover=true" (mouseleave)="isSwiperHover=false" #swiper>

            @for(movie of listMovies()()?.results;track movie.id;let i = $index;){
          <swiper-slide (mouseenter)="onMouseEnterToSlide(i,movie.id)" (mouseleave)="onMouseLeaveToSlide(i)"
                class="z-0 w-80  transition-transform duration-300 hover:scale-125 hover:z-20"
                [ngClass]="{'origin-left':i % numSlides==0,'origin-right':i % numSlides==numSlides-1}" @fade>
                <app-movie-carousel [movie]="movie" [isHovered]="hoverStates[i]" ></app-movie-carousel>
            </swiper-slide>
            }

            @if(isLoading()){
            @for(loading of slidesLoading;track loading){
            <swiper-slide class="w-80 h-80">
                <app-slide-skeleton [hasMargin]="false" @fade></app-slide-skeleton>
            </swiper-slide>
            }
            }
        </swiper-container>

           <div class="proxy-prev-{{id()}}  z-10 absolute left-2 top-1/2 w-12 h-12 flex justify-center items-center 
        hover:cursor-pointer ease-in hover:scale-110 text-center text-sm  bg-black/80
        backdrop-blur-sm text-white rounded-full transition-all duration-300 
        cursor-pointer border border-red-900/50" [class.opacity-0]="isBeginning() || !isSwiperHover" 
            (mouseenter)="isSwiperHover=true" (mouseleave)="isSwiperHover=false">
            <i class="fa-solid fa-chevron-left "></i>
        </div>
        <div class=" proxy-next-{{id()}} z-10 absolute right-2 top-1/2 w-12 h-12
        flex justify-center items-center hover:cursor-pointer ease-in 
        hover:scale-110 text-center text-sm  bg-black/80
            backdrop-blur-sm text-white rounded-full transition-all duration-300 cursor-pointer border border-red-900/50"
            [class.opacity-0]="isEnd()|| !isSwiperHover" (mouseenter)="isSwiperHover=true" (mouseleave)="isSwiperHover=false">
            <i class="fa-solid fa-chevron-right"></i>
        </div>
        

    </section>
</main>

<app-play-trailer-embeed #trailer class="opacity-0 w-80 h-48" [size]="[320,192]" (isEnded)="closeTrailerPlayer()"
    [isMovie]="true"></app-play-trailer-embeed>
