<main [style.height]="slideHeight()"
    [style.width]="slideWidth()" [style.aspect-ratio]="isVertical() ? '16 / 9': '9 / 16'"
    class="slide " #slide>

    <figure class="img-container">
        <img [ngSrc]="serie().backdrop_path || 'fallback'" ngSrcset="500w, 780w, 1280w, 1920w, 3840w" 
            [loaderParams]="{type:'backdrop'}" sizes="(max-width: 768px) 55vw, 16vw" [alt]="serie().name" fill
            loading="lazy" class="w-full h-full object-cover object-center rounded-md ">
    </figure>
</main>
