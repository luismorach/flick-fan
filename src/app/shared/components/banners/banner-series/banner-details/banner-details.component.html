<main class="w-full relative h-full">
    <section class="pb-4 text-white flex flex-grow-0 z-10 w-full h-full px-8 sm:px-10 justify-start">
        <header class="flex flex-col justify-end w-full mb-4" >

            <article class="metadata" #metadata>
            <img class="title" [src]="serie().external_ids?.imdb_id| autoImage:'logo'" 
                [alt]="serie().name" loading="lazy">

            <section class="flex flex-wrap gap-4 lg:gap-6 pt-4 text-sm lg:text-base">

                <app-rating class="flex" [rating]="serie().vote_average"></app-rating>
                
                <div class="flex items-center gap-1 sm:gap-2">
                    <app-icon name="date"  color="text-red-300" size="w-3 h-3 lg:w-4 lg:h-4"></app-icon>
                    <span>{{serie().first_air_date|date:'yyyy'}} - 
                        {{serie().last_air_date|date:'yyyy'}}
                    </span>
                </div> 

                <div class="flex items-center gap-1 sm:gap-2">
                    <app-icon name="film"  color="text-red-300" size="w-3 h-3 lg:w-4 lg:h-4"></app-icon>
                    <span>{{ serie().number_of_seasons }} temporadas, 
                        {{ serie().number_of_episodes }} episodios
                    </span>
                </div> 
            </section> 

            @if (serie().genres.length  > 0) {
                <article class="flex gap-2 pt-4">
                    @for(genre of serie().genres;track genre.id){
                    <span class="bg-red-600/30 text-red-200 px-3 py-1 rounded-full text-[12px] lg:text-sm">
                        {{ genre.name }}
                    </span>
                    }
                </article>
            }
            </article>

            <p class="overview" #overview>{{serie().overview}}</p>

            <section class="buttons" #buttons>
                <button 
                        class="btn-primary px-5" 
                        (click)="playTrailer()" 
                        [disabled]="!currentTrailerKey()"
                        [attr.aria-label]="`Reproducir avance de  ${serie().name}`"
                        (keyup.enter)="playTrailer()"
                        tabindex="0"
                        type="button">
                        <app-icon name="clapperboard"></app-icon>
                        <span>Avance</span>
                </button>

                <a [routerLink]="['/details-serie', serie().id]" 
                    class="btn-primary px-5">
                    <app-icon name="info"></app-icon>
                    <span>Más info</span>
                </a>
            </section>
        </header>
    </section>
</main>
