    
    <main>

        <img [ngSrc]="movie().backdrop_path | autoImage:'backdrop-square'" fill loading="lazy"
            class="object-cover object-center gradient">
            
        
        <div class="overlay"></div>

        <section class="text-white flex justify-around items-center md:py-12 absolute top-0 z-10 w-full h-full">
            <header class="sm:max-w-[32%]">

                <article class="metadata" >
                    <img class="title" [src]="movie().imdb_id | autoImage:'logo'" [alt]="movie().title">
                        
                    <div class="font-racing text-lg flex pt-4 gap-6 ">
                        <app-rating [rating]="movie().vote_average"></app-rating>
                        <div class="flex items-center gap-2">
                            <app-icon name="date" color="text-red-300"></app-icon>
                            <span>{{movie().release_date|date:'yyyy'}}</span>
                        </div>
                        <div class="flex items-center gap-2 -mt-1">
                            <app-icon name="clock" color="text-red-300"></app-icon>
                            <span>{{movie().runtime | minutesToTime}}</span>
                        </div>
                    </div>

                    <div class="flex pt-4 flex-wrap gap-2">
                        @for(genre of movie().genres;track genre.id){
                            <span class="bg-red-600/30 text-red-200 px-3 py-1 rounded-full text-sm">
                                {{ genre.name }}
                            </span>
                        }
                    </div>
                </article>

                <p class="overview">{{movie().overview}}</p>

                <section class="buttons">
                    <button 
                        class="btn-primary px-6" 
                        (click)="onPlayTrailer.emit()" 
                        [disabled]="!currentTrailerKey()"
                        [attr.aria-label]="`Reproducir avance de  ${movie().title}`"
                        (keyup.enter)="onPlayTrailer.emit()"
                        tabindex="0"
                        type="button">
                        <app-icon name="clapperboard" size="w-6 h-6"></app-icon>
                        <span>Avance</span>
                    </button>

                    <a [routerLink]="['/details-movie()', movie().id]" class="btn-primary px-6">
                        <app-icon name="info" size="w-6 h-6"></app-icon>
                        <span>Más información</span>
                    </a>
                    
                </section>
            </header>
            
            <a [routerLink]="['/watch-movie()', movie().id]"class="btn-primary w-14 h-14">
                <app-icon name="play" size="w-8 h-8"></app-icon>
            </a>
        </section> 
    </main>
