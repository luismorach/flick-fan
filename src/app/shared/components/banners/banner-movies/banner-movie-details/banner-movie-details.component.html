    
    <main class="h-full relative">
        <img [ngSrc]="movie().backdrop_path | autoImage:'backdrop-square'" fill loading="lazy"
            class="object-cover object-center gradient">
        
        <div class="overlay"></div>

        <section class="text-white flex justify-around items-center  z-10 w-full h-full py-12">
            <header class="xl:max-w-[32%] lg:w-2/5 md:w-1/2 sm:w-3/4 w-full px-8 md:p-0 my-auto">
                <article class="metadata" #metadata>
                    <img class="title" [src]="movie().imdb_id | autoImage:'logo'" [alt]="movie().title">
                        
                    <div class="font-racing text-sm sm:text-base flex flex-wrap pt-4 gap-4 sm:gap-6 ">
                        <app-rating [rating]="movie().vote_average"></app-rating>
                        <div class="flex items-center gap-1 sm:gap-2">
                            <app-icon name="date" color="text-red-300" size="w-3 h-3 sm:w-4 sm:h-4"></app-icon>
                            <span>{{movie().release_date|date:'yyyy'}}</span>
                        </div>
                        <div class="flex items-center gap-1 sm:gap-2 ">
                            <app-icon name="clock" color="text-red-300" size="w-3 h-3 sm:w-4 sm:h-4"></app-icon>
                            <span>{{movie().runtime | minutesToTime}}</span>
                        </div>
                    </div>

                    <div class="flex pt-4 flex-wrap gap-2">
                        @for(genre of movie().genres;track genre.id){
                            <span class="bg-red-600/30 text-red-200 px-3 py-1 rounded-full text-[12px] sm:text-sm ">
                                {{ genre.name }}
                            </span>
                        }
                    </div>
                </article>

                <p class="overview" #overview>{{movie().overview}}</p>

                <section class="buttons" #buttons>
                    <button 
                        class="btn-primary px-5" 
                        (click)="playTrailer()" 
                        [disabled]="!currentTrailerKey()"
                        [attr.aria-label]="`Reproducir avance de  ${movie().title}`"
                        (keyup.enter)="playTrailer()"
                        tabindex="0"
                        type="button">
                        <app-icon name="clapperboard"></app-icon>
                        <span>Avance</span>
                    </button>

                    <a [routerLink]="['/details-movie',movie().id]" class="btn-primary px-5">
                        <app-icon name="info"></app-icon>
                        <span>Más info</span>
                    </a>
                    
                </section>
            </header>
            
            <a [routerLink]="['/watch-movie', movie().id]" 
                class="!hidden btn-primary md:!flex w-14 h-14">
                <app-icon name="play" size="w-8 h-8"></app-icon>
            </a>
        </section> 
    </main>
