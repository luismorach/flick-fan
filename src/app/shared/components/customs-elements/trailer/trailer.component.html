<div [class]="mode() === 'float' ? 'frame-container' : 'w-full h-full'">

    <div class="player-frame" cdkDrag cdkDragRootElement=".cdk-overlay-container"
      [cdkDragDisabled]="mode() === 'embed' || !svc.isMinimized()" [ngClass]="{
        'player-float':mode() === 'float',
        'player-embed':mode() === 'embed',
        'player-float--normal':!svc.isMinimized() && mode() === 'float',
        'player-float--mini':svc.isMinimized()&& mode() === 'float',
      }" [@fadeIn]="mode() === 'embed' ? 'in' : null">

      @if (mode() === 'float'){
      <div class="frame-player-buttons">
        @if (svc.isMinimized()){
        <app-icon class="player-button" name="maximize" color="text-white" backgroundColor="#e50914" size="w-5 h-5"
          (click)="drag()._dragRef.reset();svc.maximizeFloatTrailer()"></app-icon>
        }
        <app-icon class="player-button" name="close" color="text-white" backgroundColor="#e50914" size="w-5 h-5"
          (click)="svc.hideFloatTrailer()"></app-icon>
      </div>
      }

      @if (!hasError()){
      <youtube-player [videoId]="videoKey()" [playerVars]="playerVars()" suggestedQuality="hd720"
        (error)="onPlayerError($event)" class="player pointer-events-none">
      </youtube-player>
      } @else {
      <div class="w-full h-full bg-black flex justify-center items-center text-xl">
        <i class="fa-solid fa-exclamation-triangle text-yellow-500"></i>
        <p class="px-2 text-white">Unable to load video</p>
      </div>
      }
    </div>
    
    <div class="btn-volume" (click)="changeMuted($event)" @fadeInButton>
    <app-icon [name]="mutedState() ? 'volume-xmark': 'volume-high'"></app-icon>
  </div>


  

</div>
