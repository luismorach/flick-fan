@if(rating()){
<div class="flex items-end gap-1 py-2">
    @for (char of "12345"; track char; let index = $index) {
    @let percent = calculatePercent(index);
    @let gradId = 'grad-' + index + '-' + rating();
    <app-icon name="star" color="text-red-500" backgroundColor="#e50914" [percentGrad]="percent" [gradId]="gradId">  </app-icon>
    }
    <p class="pl-1 text-center ">{{rating() | number:'1.1-1' :'en-US'}} </p>
</div>
}
