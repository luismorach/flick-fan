<main class="card-base-movie" [style.width.px]="width()" (animationend)="onAnimationEnd($event)">

   <figure class="relative w-full aspect-video ">
        <ng-template cdkPortalOutlet></ng-template>

        <img [ngSrc]="movie().backdrop_path || 'fallback'"  fill
            [loaderParams]="{type:'backdrop'}" class="card-image" loading="lazy" [alt]="movie().title" sizes="(max-width: 398px) 100vw, (max-width: 508px) 75vw, (max-width: 748px) 55vw, 
            (max-width: 988px) 38vw, (max-width: 1388px) 28vw, 22vw">

        @if(movie().vote_average){
        <figcaption class="badge-vote">
            <app-icon name="star" color="text-red-500" backgroundColor="#e50914"> </app-icon>
            <span class="badge-text">{{ movie().vote_average | number:'1.1-1' :'en-US'}}</span>
        </figcaption>
        }
    </figure> 

   <section class="pt-3 mb-3 w-full relative">
        <header class="mx-4">
            @if(movie().title){
            <h2 class="text-title-card !text-lg">{{ movie().title }}</h2>
            }
            <div class="flex items-center gap-2 mt-1">
                @if (hasGenres()) {
                <p class="text-genre-card">{{primaryGenre()}}</p>
                }

                @if(movie().release_date){
                <p class="w-1 h-1 bg-surface/20 rounded-full"></p>
                <p class="text-info-card">{{movie().release_date | date :'yyyy'}} </p>
                }
            </div>

        </header>

            <div class="card-hover-content ">
                @if(movie().overview){
                <p class="text-overview-card !text-base">
                    {{movie().overview}}
                </p>
                }
                <div class="flex gap-2 pt-4">
                    <a [routerLink]="['/watch-movie/',movie().id]" class="btn-glossy">
                        <app-icon name="play" ></app-icon>
                        Ver ahora
                    </a>
                    <a appTooltip="Añadir a la lista" class="btn-primary h-11 w-11" >
                        <app-icon name="plus" ></app-icon>
                    </a>
                   <a [routerLink]="['/details/movie',movie().id]" appTooltip="Más información"  class="btn-primary h-11 w-11 ">
                        <app-icon name="info" ></app-icon>
                    </a>
                </div>
            </div>

    </section>

</main>
