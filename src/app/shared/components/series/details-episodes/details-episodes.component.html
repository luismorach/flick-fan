<app-carousel [loader]="loaderEpisodes" [carouselOptions]="carouselOptions">
    <ng-template #headerTemplate>
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-6">
            <div>
                <span class="text-[#e50914] font-black tracking-[0.4em] uppercase text-[8px] lg:text-[10px] mb-4 block">
                    Continúa tu viaje hacia el oscuro corazón de {{serie()?.name}}
                </span>

                <h2
                    class="font-headline text-3xl md:text-4xl lg:text-5xl font-black text-[#e5e2e1] tracking-tighter uppercase">
                    Temporadas &amp;Episodios
                </h2>
            </div>

            <app-custom-select class="grow-0 shrink basis-60" [options]="serie()?.seasons ?? []"
                [(selectedOption)]="selectedSeason">
            </app-custom-select>
        </div>
    </ng-template>

    <ng-template let-data #cardTemplate>
        <div class="group cursor-pointer" [style.width.px]="data.carouselService.slidesInfo.layout().slideMainAxisSize">
            <div class="relative aspect-video rounded-xl overflow-hidden mb-4 ghost-border">
                <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                    [ngSrc]="data.media.still_path || 'fallback'" [loaderParams]="{type:'backdrop'}" fill
                    sizes="(min-width: 1280px) 32vw, (min-width: 768px) 50vw, (min-width: 480px) 25vw, 100vw" />
                <div
                    class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-all flex items-center justify-center">
                    <div class=" opacity-0 group-hover:opacity-100 transition-opacity flex justify-center items-center
                            translate-y-4 group-hover:translate-y-0 duration-300 rounded-full bg-white w-14 h-14">
                        <app-icon name="play" color="text-black" size="w-10 h-10" class=""></app-icon>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-6 mb-2">
                <h3 class="font-bold text-xl group-hover:text-[#e50914] transition-colors text-[#e5e2e1]">
                    {{data.media.episode_number}}. {{data.media.name}}</h3>
                <div class="flex gap-2 items-center">
                    <span class="w-1 h-1 bg-white/20 rounded-full"></span>
                    <span class="text-sm font-bold text-surface-variant">{{data.media.runtime | minutesToTime}}</span>
                </div>
            </div>
            <p class="text-sm text-[#e5e2e1]/60 line-clamp-2">{{data.media.overview}}</p>
        </div>

    </ng-template>
</app-carousel>
