<main appHoverSerieExpand [serie]="serie()" [carouselService]="carouselService()" [cardIndex]="cardIndex()"
    (expanded)="onHoverEnter($event)" (collapse)="onHoverLeave($event)"
    class="relative rounded-lg overflow-hidden bg-black"
    [style.width.px]="carouselService().state().slidesInfo.layout().slideMainAxisSize"
    [style.height.px]="carouselService().state().slidesInfo.layout().slideMainAxisSize * 1.5">

    <figure class="h-full absolute w-full" #posterImage>
        <img [ngSrc]="serie().poster_path || 'fallback'" fill loading="lazy" [loaderParams]="{type:'poster'}"
            [alt]="serie().name" sizes="(max-width: 398px) 100vw, (max-width: 508px) 67vw, (max-width: 748px) 50vw, 
            (max-width: 988px) 33vw, (max-width: 1388px) 25vw, 20vw">
    </figure>

    <figure class="w-full h-full relative opacity-0 " #backdropImage>

        <img [ngSrc]="serie().backdrop_path || 'fallback'" fill sizes="(max-width: 398px) 100vw, (max-width: 508px) 67vw, (max-width: 748px) 50vw, 
            (max-width: 988px) 33vw, (max-width: 1388px) 25vw, 20vw" loading="lazy" [alt]="serie().name"
            [loaderParams]="{type:'backdrop'}" class="object-cover">

        <figcaption class="overlay-serie">

            @if(serie().images && serie().images.logos && serie().images.logos.length > 0){
            @let file_path= serie().images.logos[0].file_path;
            @if(file_path){
            <figure class="relative max-h-14 h-14">
                <img class="title" [ngSrc]="file_path" [alt]="serie().name" fill
                    sizes="(max-width: 640px) 80vw, (max-width: 768px) 75vw,  (max-width: 1280px) 31vw,31vw">
            </figure>
            }
            }@else{
            <h1 class="title">{{serie().name}}</h1>
            }

            <div class="text-lg font-racing py-4 pb-16 flex gap-6">
                <a [routerLink]="['/details/serie',serie().id]" class="btn-primary px-6">
                    <app-icon name="info"></app-icon>
                    <span>Más información</span>
                </a>

                <div class="btn-primary p-4">
                    <app-icon name="plus"> </app-icon>
                </div>
            </div>

        </figcaption>
        <ng-template cdkPortalOutlet></ng-template>

    </figure>

    @if(serie().vote_average){
    <div class="badge-vote">
        <app-icon name="star" color="text-red-500" backgroundColor="fill-red-500"> </app-icon>
        <span class="badge-text">{{ serie().vote_average | number:'1.1-1' :'en-US'}}</span>
    </div>
    }
</main>
