<main class="pt-16 min-h-screen " appBackgroundNavScroll>
    <header class="text-center mb-12 mx-auto py-8">
        <h1 class="text-title"> CineSearch </h1>
        <p class="text-gray-300 text-lg">Descubre tu próxima película o serie favorita</p>
    </header>

    <section class="relative m-4 mb-12">
        <div class="absolute inset-0 bg-gradient-to-r from-red-600 to-red-800 rounded-2xl blur-xl opacity-50"></div>
        
        <div class="relative bg-black/90 backdrop-blur-xl rounded-2xl p-6 shadow-2xl ">
            <app-empty 
                title="No se han encontrado resultados" 
                [loaders]="getDataLoaders()">
            </app-empty>
           
            <div class="flex gap-4">
                <button class="btn-base" (click)="selectedType.set('all')"
                    [ngClass]="{
                        'btn-active':selectedType() === 'all',
                        'btn-inactive':selectedType() !== 'all'}">
                    Todos
                </button>
                <button class="btn-base" (click)="selectedType.set('movies')" 
                    [ngClass]="{
                        'btn-active':selectedType() === 'movies',
                        'btn-inactive':selectedType() !== 'movies'}">
                    <app-icon name="film"></app-icon> 
                    Películas
                </button>
                <button class="btn-base" (click)="selectedType.set('series')" 
                    [ngClass]="{
                        'btn-active':selectedType() === 'series',
                        'btn-inactive':selectedType() !== 'series'}">
                    <app-icon name="tv"></app-icon>
                    Series
                </button>
                <div class="flex items-center gap-2">
                    <app-icon name="filter" color="text-gray-400"></app-icon>

                    <select class="btn-base btn-inactive border border-zinc-800
                        focus:outline-none focus:border-red-500" (change)="onChangeSelectValue($event)">
                            <option [value]="0">Todos los géneros</option>
                                @for(genre of genres();track genre.id){
                            <option [value]="genre.id">{{genre.name}}</option>
                        }
                    </select>
                </div>
            </div>
        </div>
    </section>
