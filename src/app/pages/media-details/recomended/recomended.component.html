<app-carousel [loader]="recomendedLoader" [carouselOptions]="carouselOptions">
    <ng-template #headerTemplate>
        <span class="text-[#e50914] font-black tracking-[0.4em] uppercase text-[8px] lg:text-[10px] mb-4 block">
            Experiencia Recomendada
        </span>

        <h2 class="font-headline text-3xl md:text-4xl lg:text-5xl font-black text-[#e5e2e1] tracking-tighter uppercase">
            Ecos cinematográficos
        </h2>
    </ng-template>

    <ng-template let-data #cardTemplate>
        <div class="group cursor-pointer " (click)="redirect(data.media.id)"
            [style.width.px]="data.carouselService.slidesInfo.layout().slideMainAxisSize">
            <div
                class="relative aspect-[3/4.5] rounded-3xl overflow-hidden mb-6 ring-1 ring-white/5 group-hover:ring-[#e50914]/40 transition-all duration-700">
                <img [ngSrc]="data.media.poster_path" fill [loaderParams]="{type:'poster'}"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000" />

                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80">
                </div>
            </div>
            <div class="flex flex-col items-center">
                <h4 class="text-surface font-black text-lg tracking-tight group-hover:text-[#e50914] 
                    transition-colors line-clamp-1"> {{getTitle(data.media) }}
                </h4>

                <div class="flex items-center gap-2 mt-1">
                    <span class="text-surface-variant text-[11px] font-black uppercase tracking-widest">
                        {{data.media.genres[0].name}}
                    </span>
                    <span class="w-1 h-1 bg-white/20 rounded-full"></span>
                    <span class="text-surface-variant text-[11px] font-black uppercase tracking-widest">
                        {{getReleaseDate(data.media)| date :'yyyy'}}
                    </span>
                </div>
            </div>
        </div>
    </ng-template>

    <ng-template let-data #skeletonTemplate>
        <div class="aspect-[3/4.5] rounded-3xl  bg-surface/10 animate-pulse"
            [style.width.px]="data.carouselService.slidesInfo.layout().slideMainAxisSize">
        </div>
    </ng-template>
</app-carousel>
