<main appBackgroundNavScroll>
  <app-empty 
        title="No hay series disponibles" 
        subtitle="Vuelve más tarde para ver nuevas series"
        [signals]="[onTheAir,popularSeries]">
  </app-empty>

  @defer(when onTheAir()){
    <app-banner-series [listSeries]="onTheAir" @fade> </app-banner-series>
  }@placeholder{
    <app-skeleton [hasSlides]="true" @fade></app-skeleton>
  }
  
  <app-series-grid [data]="popularSeries()"></app-series-grid>

 </main>
