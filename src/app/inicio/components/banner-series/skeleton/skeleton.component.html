<!-- banner-series-skeleton.component.html -->
<main class="w-full relative z-0 animate-pulse bg-black" [class.py-24]="hasSlides()">

  <!-- Imagen de fondo simulada -->
  <figure class="w-full h-[90vh] absolute bg-black"></figure>

  <section class="w-full grid grid-cols-3 gap-4 relative h-[90vh]">
    @if(hasSlides()){

    <!-- Swiper con slides simulados -->
    <div class="h-[90vh] flex items-center justify-center flex-col ml-16 relative">
      <!-- Botones flechas (superior e inferior) -->
      <div class="absolute left-5/12 top-4 w-12 h-12 bg-zinc-700/70 rounded-full"></div>
      <div class="absolute left-5/12 bottom-4 w-12 h-12 bg-zinc-700/70 rounded-full"></div>

      <div class="w-52 h-24 rounded-md border translate-y-[40%]"></div>
      <div class="w-52 h-24 rounded-md scale-150"></div>
      <div class="w-52 h-24 bg-zinc-700 rounded-md scale-200 z-20 border  border-red-900/30"></div>
      <div class="w-52 h-24 bg-zinc-700 rounded-md scale-150 z-10 border  border-red-900/30"></div>
      <div class="w-52 h-24 bg-zinc-700 rounded-md border  border-red-900/30 -translate-y-[40%]"></div>
    </div>
    }

    <!-- Información de la serie -->
    <div class="col-start-2 col-span-2 pb-4 flex  z-10 w-full md:px-32 justify-start">
      <header class="flex flex-col justify-end w-full space-y-4 ">

        <!-- Título -->
        <div class="h-10 w-1/3 bg-zinc-600 rounded"></div>

        <!-- Rating + temporadas/episodios -->
        <div class="flex gap-6">
          <div class="h-6 w-24 bg-zinc-600 rounded"></div>
          <div class="h-6 w-40 bg-zinc-600 rounded"></div>
        </div>

        <!-- Géneros -->
        <div class="flex gap-2">
          <div class="h-6 w-16 bg-zinc-600 rounded-full"></div>
          <div class="h-6 w-20 bg-zinc-600 rounded-full"></div>
        </div>

        <!-- Fechas -->
        <div class="flex gap-4">
          <div class="h-4 w-48 bg-zinc-600 rounded"></div>
          <div class="h-4 w-48 bg-zinc-600 rounded"></div>
        </div>

        <!-- Botón más información -->
        <div class="h-10 w-52 bg-zinc-600 rounded-xl mt-4"></div>
      </header>
    </div>
  </section>
</main>
