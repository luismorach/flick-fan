<app-banner [listMovies]="nowPlaying()" (onPlayTrailer)="playTrailer($event)"></app-banner>

@defer(when popularMovies()){
    <app-carousel @fade [listMovies]="popularMovies" title="populares" [importance]="3" 
        (onPlayTrailer)="playTrailer($event)" (requestMoreData)="getMoreData(this.API.getPopular.bind(this.API),popularMovies)">
    </app-carousel>
}
@placeholder{
    <app-carousel-skeleton @fade ></app-carousel-skeleton>
}
 
@defer(when upcomingMovies()){
    <app-carousel @fade [listMovies]="upcomingMovies" title="recientes" [importance]="2"
        (onPlayTrailer)="playTrailer($event)" (requestMoreData)="getMoreData(this.API.getUpcoming.bind(this.API),upcomingMovies)">
    </app-carousel>
}@placeholder{
    <app-carousel-skeleton @fade ></app-carousel-skeleton>
}

@defer(when airingToday() ){
<app-banner-series [listSeries]="airingToday()"></app-banner-series>
}

<app-carousel-series [listSeries]="airingToday()" title="populares" [importance]="2"></app-carousel-series>

@defer(when player.isPlaying){
<app-play-trailer [videoKey]="player.videoId()"></app-play-trailer>
}
@placeholder{
<span></span>
}
