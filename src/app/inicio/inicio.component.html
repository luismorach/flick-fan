<main appBackgroundNavScroll>
    @defer(when nowPlaying()){
    <app-banner-movie [movieList]="nowPlaying" (onPlayTrailer)="playTrailer($event)"
        (requestMoreData)="api.getMoreData(nowPlaying)" @fade>
    </app-banner-movie>
    }
    @placeholder{
    <app-banner-skeleton @fade></app-banner-skeleton>
    }


    <app-carousel-movies @fade [movieList]="popularMovies()" title="Películas populares"  @fade>
    </app-carousel-movies>



    <app-carousel-movies @fade [movieList]="upcomingMovies()" title="Películas recientes" @fade>
    </app-carousel-movies>



    @defer(when airingToday()){
    <app-banner-series [listSeries]="airingToday" (requestMoreData)="api.getMoreData(airingToday)" @fade>
    </app-banner-series>
    }@placeholder{
    <app-skeleton [hasSlides]="true" @fade></app-skeleton>
    }
   
    <app-carousel-series [seriesList]="onTheAir()" title="Series al aire" @fade>
    </app-carousel-series>
   
    <app-carousel-series [seriesList]="popularSeries()" title="Series populares" @fade>
    </app-carousel-series>
    

    @defer(when player.isPlaying){
    <app-play-trailer [videoKey]="player.videoId()"></app-play-trailer>
    }
    @placeholder{
    <span></span>
    }
</main>
