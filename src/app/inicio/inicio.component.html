<main appBackgroundNavScroll>
    <app-banner-movie [movieList]="nowPlaying()"></app-banner-movie>
   
    <app-carousel-movies [movieList]="popularMovies()" title="Películas populares" [zIndex]="3">
    </app-carousel-movies>

    <app-carousel-movies [movieList]="upcomingMovies()" title="Películas recientes" [zIndex]="2">
    </app-carousel-movies>

    @defer(when airingToday()){
    <app-banner-series [listSeries]="airingToday" (requestMoreData)="api.getMoreData(airingToday)" @fade>
    </app-banner-series>
    }@placeholder{
    <app-skeleton [hasSlides]="true" @fade></app-skeleton>
    }
   
    <app-carousel-series [seriesList]="onTheAir()" title="Series al aire" @fade>
    </app-carousel-series>
   
    <app-carousel-series [seriesList]="popularSeries()" title="Series populares" @fade>
    </app-carousel-series>
    
</main>
