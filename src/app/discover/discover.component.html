<main appBackgroundNavScroll>

  <header class="text-center mx-auto pt-24">
    <h1 class="text-title"> CineSearch </h1>
    <p class="text-gray-300 text-lg">Descubre tu próxima película o serie favorita</p>
  </header>

  <div class="flex min-h-screen pt-12 ">
    <div class="flex-1 flex flex-col lg:pr-6">

      <nav class="flex mx-6 mb-6 gap-8 justify-between sm:justify-normal sticky top-16 z-10 ">
        <div class="absolute inset-0 bg-gradient-to-r from-red-600 to-red-800 rounded-2xl blur-xl opacity-50"></div>

        <div class="relative bg-black/90 backdrop-blur-xl rounded-2xl p-6 shadow-2xl w-full flex gap-8">
          <button class="btn-base" (click)="selectedMediaType.set('movies')" [ngClass]="{
                        'btn-active':selectedMediaType() === 'movies',
                        'btn-inactive':selectedMediaType() !== 'movies'}">
            <app-icon name="film"></app-icon>
            Películas
          </button>
          <button class="btn-base" [ngClass]="{
                        'btn-active':selectedMediaType() === 'series',
                        'btn-inactive':selectedMediaType() !== 'series'}" (click)="selectedMediaType.set('series')">
            <app-icon name="tv"></app-icon>
            Series
          </button>

          <div class="flex items-center gap-4 w-full">
            <app-icon name="filter" color="text-gray-400"></app-icon>
            @if(query() === ''){
            <app-custom-select class="grow-0 shrink basis-60" [options]="currentCategories()"
              [(selectedOption)]="selectedCategory"></app-custom-select>
            }
            <app-custom-select class="grow-0 shrink basis-60 hidden sm:block" [options]="optionsGenre()"
              [(selectedOption)]="selectedGenre"></app-custom-select>
          </div>
        </div>
      </nav>

      <app-cards-grid [selectedGenre]="selectedGenre()"
        [mediaTypeSelected]="selectedMediaType()" [selectedCategory]="selectedCategory()"
        [(selectedItem)]="selectedItem">

      </app-cards-grid>
    </div>

    <app-details-card class="w-[26rem]  hidden lg:block" [selectedItem]="selectedItem()"
      [(selectedGenre)]="selectedGenre"></app-details-card>

  </div>

</main>
